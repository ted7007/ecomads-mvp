version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ecomads-db
    restart: always
    environment:
      POSTGRES_USER: ecomads_user
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: ecomads_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Ecomads.WebApplication/Dockerfile
    container_name: ecomads-web
    restart: always
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=ecomads_db;Username=ecomads_user;Password=your_secure_password"
    expose:
      - "8080"   # 👈 ВАЖНО: НЕ ports!

  nginx:
      image: nginx:alpine
      container_name: ecomads-nginx
      restart: always
      depends_on:
        - web
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./nginx/ssl:/etc/nginx/ssl:ro
volumes:
  postgres_data:
