<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcomAds · Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius-card);
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
        }
        .auth-card h2 { margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 14px; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--neutral);
            font-family: inherit;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        .error-message {
            color: var(--danger);
            margin-top: 16px;
            text-align: center;
            display: none;
        }
        .tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--neutral);
        }
        .tab {
            padding: 12px 0;
            margin-right: 24px;
            cursor: pointer;
            position: relative;
            color: var(--text-secondary);
        }
        .tab.active {
            color: var(--accent);
            font-weight: 600;
        }
        .tab.active:after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="tabs">
                <div class="tab active" data-tab="login">Вход</div>
                <div class="tab" data-tab="register">Регистрация</div>
            </div>
            
            <div id="login-form" class="tab-content active">
                <h2>Вход в EcomAds</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button class="btn-primary" id="login-button">Войти</button>
                <div id="login-error" class="error-message"></div>
            </div>
            
            <div id="register-form" class="tab-content">
                <h2>Регистрация в EcomAds</h2>
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="register-name" placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="register-email" placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="register-password" placeholder="••••••••">
                </div>
                <button class="btn-primary" id="register-button">Зарегистрироваться</button>
                <div id="register-error" class="error-message"></div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { login, checkAuth } from '/js/auth.js';
        
        // Проверяем, авторизован ли пользователь
        checkAuth().then(isAuth => {
            if (isAuth) {
                window.location.href = '/dashboard.html';
            }
        });
        
        // Переключение между вкладками входа и регистрации
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}-form`).classList.add('active');
            });
        });
        
        // Обработка входа
        document.getElementById('login-button').addEventListener('click', async () => {
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const button = document.getElementById('login-button');
            const errorElement = document.getElementById('login-error');
            
            // Валидация
            if (!emailInput.value || !passwordInput.value) {
                errorElement.textContent = 'Пожалуйста, заполните все поля';
                errorElement.style.display = 'block';
                return;
            }
            
            try {
                // Отображаем состояние загрузки
                button.textContent = 'Загрузка...';
                button.disabled = true;
                
                await login(emailInput.value, passwordInput.value);
                window.location.href = '/dashboard.html';
            } catch (error) {
                errorElement.textContent = error.message || 'Ошибка входа';
                errorElement.style.display = 'block';
                button.textContent = 'Войти';
                button.disabled = false;
            }
        });
        
        // Обработка регистрации
        document.getElementById('register-button').addEventListener('click', async () => {
            const nameInput = document.getElementById('register-name');
            const emailInput = document.getElementById('register-email');
            const passwordInput = document.getElementById('register-password');
            const button = document.getElementById('register-button');
            const errorElement = document.getElementById('register-error');
            
            // Валидация
            if (!nameInput.value || !emailInput.value || !passwordInput.value) {
                errorElement.textContent = 'Пожалуйста, заполните все поля';
                errorElement.style.display = 'block';
                return;
            }
            
            try {
                // Отображаем состояние загрузки
                button.textContent = 'Загрузка...';
                button.disabled = true;
                
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: nameInput.value,
                        email: emailInput.value,
                        password: passwordInput.value
                    }),
                });
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.message || 'Ошибка регистрации');
                }
                
                const data = await response.json();
                
                // Сохраняем токен и информацию о пользователе
                localStorage.setItem('ecomads_token', data.token);
                localStorage.setItem('ecomads_user', JSON.stringify({
                    id: data.sellerId,
                    name: data.name,
                    email: data.email
                }));
                
                window.location.href = '/dashboard.html';
            } catch (error) {
                errorElement.textContent = error.message || 'Ошибка регистрации';
                errorElement.style.display = 'block';
                button.textContent = 'Зарегистрироваться';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
