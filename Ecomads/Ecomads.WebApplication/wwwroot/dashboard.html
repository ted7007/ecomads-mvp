<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcomAds · Дашборд</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app">
        <div id="sidebar-root"></div>

        <div class="main">
            <div class="header">
                <div class="header-left">Главный дашборд</div>
            </div>
            <div class="content" id="dashboard-content">
                <!-- Кнопка обновления статистики -->
                <div class="mobile-action-container" style="display: flex; justify-content: flex-end; margin-bottom: 24px; flex-wrap: wrap;">
                    <button class="refresh-btn" onclick="document.getElementById('upload-modal').style.display='flex'">
                        <i data-feather="refresh-cw"></i> <span class="btn-text">Загрузить новую статистику</span>
                    </button>
                </div>

                <!-- KPI Grid -->
                <div class="grid mb-32">
                    <div class="kpi-card" style="grid-column: span 3;">
                        <span class="text-label"><i data-feather="wallet"></i> Расход</span>
                        <div class="kpi-number" id="kpi-spent">0 ₽</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 3;">
                        <span class="text-label"><i data-feather="shopping-bag"></i> Заказы</span>
                        <div class="kpi-number" id="kpi-orders">0</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 3;">
                        <span class="text-label"><i data-feather="target"></i> ДРР</span>
                        <div class="kpi-number" id="kpi-drr">0%</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 3;">
                        <span class="text-label"><i data-feather="trending-up"></i> CTR</span>
                        <div class="kpi-number" id="kpi-ctr">0%</div>
                    </div>
                </div>

                <div class="card">
                    <h2 class="level-title">Рекламные кампании</h2>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th>Расход</th>
                                    <th>ДРР</th>
                                    <th>Клики</th>
                                    <th>CTR</th>
                                    <th>Действие</th>
                                </tr>
                            </thead>
                            <tbody id="campaigns-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { renderSidebar } from '/js/sidebar.js';
        import { createUploadModal } from '/js/modal.js';
        
        renderSidebar('dashboard');
        createUploadModal();
    </script>
    <script type="module" src="/js/main.js"></script>
    <script>
        // Инициализация иконок после динамической загрузки
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => feather.replace({ strokeWidth: 1.5, width: 18, height: 18 }), 100);
        });
    </script>
</body>
</html>
