<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcomAds · Кампания</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app">
        <div id="sidebar-root"></div>

        <div class="main">
            <div class="header">
                <div class="header-left">
                    <span id="campaign-name">Загрузка...</span>
                </div>
                <div class="header-right">
                    <!-- Placeholder for search/user -->
                </div>
            </div>
            <div class="content">
                <!-- Кнопка обновления статистики -->
                <div style="display: flex; justify-content: flex-end; margin-bottom: 24px;">
                    <button class="refresh-btn" onclick="alert('Обновление статистики (демо)')">
                        <i data-feather="refresh-cw"></i> Загрузить новую статистику
                    </button>
                </div>

                <!-- KPI -->
                <div class="grid mb-32">
                    <div class="kpi-card" style="grid-column: span 3;">
                        <span class="text-label"><i data-feather="wallet"></i> Расход</span>
                        <div class="kpi-number">45 200 ₽</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 3;">
                        <span class="text-label"><i data-feather="shopping-bag"></i> Заказы</span>
                        <div class="kpi-number">312</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 3;">
                        <span class="text-label"><i data-feather="target"></i> ДРР</span>
                        <div class="kpi-number">28.7%</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 3;">
                        <span class="text-label"><i data-feather="trending-up"></i> CTR</span>
                        <div class="kpi-number">3.2%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { renderSidebar } from '/js/sidebar.js';
        renderSidebar('campaign');
    </script>
    <script>
        feather.replace({ strokeWidth: 1.5, width: 18, height: 18 });
        
        // Чтение ID из URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) {
            document.getElementById('campaign-name').textContent = 'Кампания #' + id;
        }
    </script>
</body>
</html>
