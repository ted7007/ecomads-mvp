<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcomAds · Кампания</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Стили для рекомендаций */
        .rec-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid transparent;
            box-shadow: var(--shadow);
        }
        .rec-card.rule-1 { border-left-color: var(--danger); }
        .rec-card.rule-2 { border-left-color: var(--warning); }
        .rec-card.rule-3 { border-left-color: var(--warning); }
        .rec-card.rule-4 { border-left-color: var(--success); }
        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .rec-title {
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .rec-rule-badge {
            background: #E2E8F0;
            color: #0F172A;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 30px;
        }
        .rec-detail {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin: 16px 0;
        }
        .rec-item {
            background: #F1F5F9;
            border-radius: 12px;
            padding: 12px;
        }
        .rec-item strong {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .rec-item p {
            color: var(--text-secondary);
            font-size: 13px;
        }
        .rec-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0 12px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: transparent;
            border: 1.5px solid;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s ease;
        }
        .action-btn:hover {
            opacity: 0.8;
        }
        .action-btn.accept { border-color: var(--success); color: var(--success); }
        .action-btn.later { border-color: var(--warning); color: #B45309; }
        .action-btn.dismiss { border-color: var(--neutral); color: var(--text-secondary); }
        .action-btn.selected {
            background-color: rgba(0,0,0,0.1);
            font-weight: 700;
        }
        .rec-comment input {
            width: 100%;
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            border-radius: 40px;
            padding: 10px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
        }
        .mb-32 { margin-bottom: 32px; }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .section-title {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Индикатор загрузки */
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-loading {
            opacity: 0.7;
            pointer-events: none;
        }
        
        .btn-loading .loader {
            display: inline-block;
        }

        .keyword-dashboard-card {
            display: flex;
            flex-direction: column;
            max-height: min(620px, calc(100vh - 280px));
            overflow: hidden;
        }

        .keyword-dashboard-card .level-title {
            flex: 0 0 auto;
            margin-bottom: 16px;
        }

        .keyword-dashboard-scroll {
            flex: 1 1 auto;
            min-height: 260px;
            overflow: auto;
        }

        .keyword-dashboard-scroll table {
            min-width: 1220px;
        }

        .keyword-dashboard-scroll thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--card-bg);
        }

        .keyword-dashboard-scroll th.keyword-sortable {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .keyword-dashboard-scroll th.keyword-sortable::after {
            content: " ↕";
            color: var(--text-secondary);
            font-weight: 500;
        }

        .keyword-dashboard-scroll th.keyword-sortable[data-sort-dir="asc"]::after {
            content: " ↑";
            color: var(--text-primary);
        }

        .keyword-dashboard-scroll th.keyword-sortable[data-sort-dir="desc"]::after {
            content: " ↓";
            color: var(--text-primary);
        }
        
        /* Адаптивный дизайн для рекомендаций */
        @media (max-width: 768px) {
            .rec-detail {
                grid-template-columns: 1fr;
            }

            .keyword-dashboard-card {
                max-height: calc(100vh - 180px);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div id="sidebar-root"></div>

        <div class="main">
            <div class="header">
                <div class="header-left">
                    <span id="campaign-name">Загрузка...</span>
                </div>
                <div class="header-right">
                    <!-- Placeholder for search/user -->
                </div>
            </div>
            <div class="content">
                <div class="page-toolbar mobile-action-container">
                    <div class="page-filter-group">
                        <div>
                            <label class="text-label" for="campaign-period-select">Загруженный период</label>
                            <select id="campaign-period-select">
                                <option value="">Все периоды</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-label" for="campaign-start-date">С даты</label>
                            <input type="date" id="campaign-start-date">
                        </div>
                        <div>
                            <label class="text-label" for="campaign-end-date">По дату</label>
                            <input type="date" id="campaign-end-date">
                        </div>
                        <button class="refresh-btn" id="campaign-apply-period">
                            Применить период
                        </button>
                    </div>
                    <button class="refresh-btn page-upload-btn" onclick="document.getElementById('upload-modal').style.display='flex'">
                        <i data-feather="refresh-cw"></i> <span class="btn-text">Загрузить новую статистику</span>
                    </button>
                </div>

                <!-- KPI -->
                <div class="grid mb-32">
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="dollar-sign"></i> Заказано на сумму</span>
                        <div class="kpi-number" id="campaign-kpi-ordered-amount">0 ₽</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="wallet"></i> Расход</span>
                        <div class="kpi-number" id="campaign-kpi-spent">0 ₽</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="shopping-bag"></i> Заказы</span>
                        <div class="kpi-number" id="campaign-kpi-orders">0</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="target"></i> ДРР</span>
                        <div class="kpi-number" id="campaign-kpi-drr">0%</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="trending-up"></i> CTR</span>
                        <div class="kpi-number" id="campaign-kpi-ctr">0%</div>
                    </div>
                </div>

                <!-- Статистика по ключевым словам -->
                <div class="card mb-32 keyword-dashboard-card">
                    <div class="keyword-overlay-header">
                        <h2 class="level-title">Статистика по ключевым словам</h2>
                        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                            <span id="keyword-overlay-mode" class="keyword-overlay-mode">Статистика</span>
                            <button id="refresh-insights" class="refresh-btn">
                                <span class="loader" style="display: none;"></span>
                                <i data-feather="refresh-cw"></i>
                                Обновить insights
                            </button>
                        </div>
                    </div>
                    <div id="keyword-overlay-summary" class="keyword-overlay-summary" hidden></div>
                    <div id="keyword-status-filters" class="keyword-status-filters" hidden></div>
                    <div class="table-wrapper keyword-dashboard-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th class="keyword-sortable" data-sort="phrase">Фраза</th>
                                    <th class="keyword-sortable" data-sort="status">Статус</th>
                                    <th class="keyword-sortable" data-sort="shortRecommendation">Рекомендация</th>
                                    <th class="keyword-sortable" data-sort="impressions">Показы</th>
                                    <th class="keyword-sortable" data-sort="clicks">Клики</th>
                                    <th class="keyword-sortable" data-sort="ctr">CTR</th>
                                    <th class="keyword-sortable" data-sort="spend">Затраты</th>
                                    <th class="keyword-sortable" data-sort="orders">Заказы</th>
                                    <th class="keyword-sortable" data-sort="revenue">Выручка</th>
                                    <th class="keyword-sortable" data-sort="drr">ДРР</th>
                                </tr>
                            </thead>
                            <tbody id="keywords-body">
                                <!-- Сюда JS вставит данные -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <aside id="keyword-insight-panel" class="keyword-insight-panel" aria-live="polite" hidden></aside>
            </div>
        </div>
    </div>
    <script type="module">
        import { renderSidebar } from '/js/sidebar.js';
        import { createUploadModal } from '/js/modal.js';
        import { setupCampaignPeriodControls } from '/js/main.js';
        import { generateRecommendation } from '/js/recommendations.js';
        
        renderSidebar('campaign');
        
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        
        if (id) {
            document.getElementById('campaign-name').textContent = `Кампания #${id}`;
            await setupCampaignPeriodControls(id);

            const refreshButton = document.getElementById('refresh-insights');
            refreshButton.addEventListener('click', async function() {
                this.classList.add('btn-loading');
                this.querySelector('.loader').style.display = 'inline-block';
                
                try {
                    await generateRecommendation(id);
                    if (typeof window.reloadKeywordRecommendationOverlay === 'function') {
                        await window.reloadKeywordRecommendationOverlay();
                    }
                    
                    alert('Insights успешно обновлены!');
                } catch (error) {
                    console.error('Ошибка при обновлении insights:', error);
                    alert('Ошибка при генерации insights');
                } finally {
                    this.classList.remove('btn-loading');
                    this.querySelector('.loader').style.display = 'none';
                }
            });
        }
        else {
            document.getElementById('campaign-name').textContent = 'Кампания не выбрана';
        }
        
        createUploadModal(true, id);
    </script>
    <script>
        feather.replace({ strokeWidth: 1.5, width: 18, height: 18 });
    </script>
</body>
</html>
