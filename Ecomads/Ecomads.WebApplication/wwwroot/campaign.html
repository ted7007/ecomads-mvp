<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcomAds · Кампания</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Стили для рекомендаций */
        .rec-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid transparent;
            box-shadow: var(--shadow);
        }
        .rec-card.rule-1 { border-left-color: var(--danger); }
        .rec-card.rule-2 { border-left-color: var(--warning); }
        .rec-card.rule-3 { border-left-color: var(--warning); }
        .rec-card.rule-4 { border-left-color: var(--success); }
        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .rec-title {
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .rec-rule-badge {
            background: #E2E8F0;
            color: #0F172A;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 30px;
        }
        .rec-detail {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin: 16px 0;
        }
        .rec-item {
            background: #F1F5F9;
            border-radius: 12px;
            padding: 12px;
        }
        .rec-item strong {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .rec-item p {
            color: var(--text-secondary);
            font-size: 13px;
        }
        .rec-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0 12px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: transparent;
            border: 1.5px solid;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s ease;
        }
        .action-btn:hover {
            opacity: 0.8;
        }
        .action-btn.accept { border-color: var(--success); color: var(--success); }
        .action-btn.later { border-color: var(--warning); color: #B45309; }
        .action-btn.dismiss { border-color: var(--neutral); color: var(--text-secondary); }
        .action-btn.selected {
            background-color: rgba(0,0,0,0.1);
            font-weight: 700;
        }
        .rec-comment input {
            width: 100%;
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            border-radius: 40px;
            padding: 10px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
        }
        .mb-32 { margin-bottom: 32px; }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .section-title {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Индикатор загрузки */
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-loading {
            opacity: 0.7;
            pointer-events: none;
        }
        
        .btn-loading .loader {
            display: inline-block;
        }
        
        /* Адаптивный дизайн для рекомендаций */
        @media (max-width: 768px) {
            .rec-detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div id="sidebar-root"></div>

        <div class="main">
            <div class="header">
                <div class="header-left">
                    <span id="campaign-name">Загрузка...</span>
                </div>
                <div class="header-right">
                    <!-- Placeholder for search/user -->
                </div>
            </div>
            <div class="content">
                <!-- Кнопка обновления статистики -->
                <div class="mobile-action-container" style="display: flex; justify-content: flex-end; margin-bottom: 24px; flex-wrap: wrap;">
                    <button class="refresh-btn" onclick="document.getElementById('upload-modal').style.display='flex'">
                        <i data-feather="refresh-cw"></i> <span class="btn-text">Загрузить новую статистику</span>
                    </button>
                </div>
                <div class="mobile-action-container" style="display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; align-items: end;">
                    <div>
                        <label class="text-label" for="campaign-period-select" style="color:#E2E8F0;">Загруженный период</label>
                        <select id="campaign-period-select" style="background:#FFFFFF; color:#0F172A; border:1px solid #CBD5E1; border-radius:10px; padding:8px 10px;">
                            <option value="">Все периоды</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-label" for="campaign-start-date" style="color:#E2E8F0;">С даты</label>
                        <input type="date" id="campaign-start-date" style="background:#FFFFFF; color:#0F172A; border:1px solid #CBD5E1; border-radius:10px; padding:8px 10px;">
                    </div>
                    <div>
                        <label class="text-label" for="campaign-end-date" style="color:#E2E8F0;">По дату</label>
                        <input type="date" id="campaign-end-date" style="background:#FFFFFF; color:#0F172A; border:1px solid #CBD5E1; border-radius:10px; padding:8px 10px;">
                    </div>
                    <button class="refresh-btn" id="campaign-apply-period">
                        Применить период
                    </button>
                </div>

                <!-- KPI -->
                <div class="grid mb-32">
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="dollar-sign"></i> Заказано на сумму</span>
                        <div class="kpi-number" id="campaign-kpi-ordered-amount">0 ₽</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="wallet"></i> Расход</span>
                        <div class="kpi-number" id="campaign-kpi-spent">0 ₽</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="shopping-bag"></i> Заказы</span>
                        <div class="kpi-number" id="campaign-kpi-orders">0</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="target"></i> ДРР</span>
                        <div class="kpi-number" id="campaign-kpi-drr">0%</div>
                    </div>
                    <div class="kpi-card" style="grid-column: span 2;">
                        <span class="text-label"><i data-feather="trending-up"></i> CTR</span>
                        <div class="kpi-number" id="campaign-kpi-ctr">0%</div>
                    </div>
                </div>

                <!-- Статистика по ключевым словам -->
                <div class="card mb-32">
                    <h2 class="level-title">Статистика по ключевым словам</h2>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Фраза</th>
                                    <th>Показы</th>
                                    <th>Клики</th>
                                    <th>CTR</th>
                                    <th>Затраты</th>
                                    <th>Заказы</th>
                                    <th>Выручка</th>
                                    <th>ДРР</th>
                                </tr>
                            </thead>
                            <tbody id="keywords-body">
                                <!-- Сюда JS вставит данные -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Рекомендации -->
                <div class="mb-32">
                    <div class="section-header">
                        <h2 class="section-title"><i data-feather="zap"></i> Рекомендации по кампании</h2>
                        <button id="refresh-recommendations" class="refresh-btn">
                            <span class="loader" style="display: none;"></span>
                            <i data-feather="refresh-cw"></i> 
                            Обновить рекомендации
                        </button>
                    </div>
                    <div id="recommendations-container">
                        <!-- Сюда JS вставит рекомендации -->
                        <p>Загрузка рекомендаций...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { renderSidebar } from '/js/sidebar.js';
        import { createUploadModal } from '/js/modal.js';
        import { setupCampaignPeriodControls } from '/js/main.js';
        import { loadRecommendations, generateRecommendation, renderRecommendations } from '/js/recommendations.js';
        
        renderSidebar('campaign');
        
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        
        if (id) {
            document.getElementById('campaign-name').textContent = `Кампания #${id}`;
            await setupCampaignPeriodControls(id);
            
            // Загружаем рекомендации
            const recommendationsContainer = document.getElementById('recommendations-container');
            loadRecommendationsData();
            
            // Обработчик кнопки обновления рекомендаций
            const refreshButton = document.getElementById('refresh-recommendations');
            refreshButton.addEventListener('click', async function() {
                // Показываем индикатор загрузки
                this.classList.add('btn-loading');
                this.querySelector('.loader').style.display = 'inline-block';
                
                try {
                    // Генерируем новую рекомендацию
                    await generateRecommendation(id);
                    
                    // Перезагружаем список рекомендаций
                    await loadRecommendationsData();
                    
                    alert('Рекомендация успешно сгенерирована!');
                } catch (error) {
                    console.error('Ошибка при обновлении рекомендаций:', error);
                    alert('Ошибка при генерации рекомендации');
                } finally {
                    // Скрываем индикатор загрузки
                    this.classList.remove('btn-loading');
                    this.querySelector('.loader').style.display = 'none';
                }
            });
            
            async function loadRecommendationsData() {
                recommendationsContainer.innerHTML = '<p>Загрузка рекомендаций...</p>';
                
                try {
                    const recommendations = await loadRecommendations(id);
                    renderRecommendations(recommendations, recommendationsContainer);
                } catch (error) {
                    console.error('Ошибка при загрузке рекомендаций:', error);
                    recommendationsContainer.innerHTML = '<p>Ошибка при загрузке рекомендаций</p>';
                }
            }
        }
        else {
            document.getElementById('campaign-name').textContent = 'Кампания не выбрана';
        }
        
        createUploadModal(true, id);
    </script>
    <script>
        feather.replace({ strokeWidth: 1.5, width: 18, height: 18 });
    </script>
</body>
</html>
